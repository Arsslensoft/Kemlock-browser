# The rules of the Security job's gitleaks step (.github/workflows/checks.yml): gitleaks' default
# rules, with the files that hold keys and tokens on purpose set aside.
title = "Kemlock-browser gitleaks rules"

[extend]
useDefault = true

[[allowlists]]
description = "Test keys, vault fixtures and sample secrets, made for the tests (the app's own sync files among them)"
paths = [
  '''^tests/''',
  '''^test/fixtures/''',
  '''\.test\.tsx?$''',
  '''^core/test/''',
]
