name: Toolchain
description: >-
  Node and the Dart SDK, the versions tool/docker/Containerfile pins, each downloaded and checked
  against its SHA-256 before it is unpacked. Used in place of actions/setup-node and
  dart-lang/setup-dart, which download by version alone. Linux x64 only. Needs curl, python3 and
  sha256sum, which the hosted runner and the Playwright image have (neither has unzip or xz, and
  none is needed).

inputs:
  node:
    description: Whether to install Node
    required: false
    default: 'false'
  dart:
    description: Whether to install the Dart SDK (and set DART_SDK to it, as the build container does)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Bump these with tool/docker/Containerfile's (CONTRIBUTING.md): Dependabot cannot read either
    - name: Node
      if: inputs.node == 'true'
      shell: bash
      env:
        NODE_VERSION: 26.13.0
        NODE_SHA256: d28a96af6c38596f6d9d97c0ee531c13d238d757742387d1928de822d959e997
      # Only a fixed path under RUNNER_TEMP, built from the constant version above, reaches $GITHUB_PATH:
      # nothing a pull request controls is written, which is what github-env guards against
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        dest="${RUNNER_TEMP}/toolchain"
        archive="${RUNNER_TEMP}/node-${NODE_VERSION}.tar.xz"
        mkdir -p "${dest}"
        curl --fail --retry 3 -sSL -o "${archive}" \
          "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
        echo "${NODE_SHA256}  ${archive}" | sha256sum -c -
        rm -rf "${dest}/node-v${NODE_VERSION}-linux-x64"
        # Python unpacks it: the Playwright image has no xz. Its 'data' filter refuses links and
        # paths that leave the folder, and the special permission bits
        python3 -I - "${archive}" "${dest}" <<'PY'
        import sys, tarfile
        with tarfile.open(sys.argv[1], 'r:xz') as tar:
            tar.extractall(sys.argv[2], filter='data')
        PY
        rm -f "${archive}"
        echo "${dest}/node-v${NODE_VERSION}-linux-x64/bin" >> "$GITHUB_PATH"

    - name: Dart SDK
      if: inputs.dart == 'true'
      shell: bash
      env:
        DART_VERSION: 3.13.5
        DART_SHA256: ea864bc64df30a6b8bdf30b2e32550f7717d9a890de8f40293aeabb924fe232b
      # As above: $GITHUB_PATH, and DART_SDK in $GITHUB_ENV, get fixed paths under RUNNER_TEMP only
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        dest="${RUNNER_TEMP}/toolchain"
        archive="${RUNNER_TEMP}/dartsdk-${DART_VERSION}.zip"
        mkdir -p "${dest}"
        curl --fail --retry 3 -sSL -o "${archive}" \
          "https://storage.googleapis.com/dart-archive/channels/stable/release/${DART_VERSION}/sdk/dartsdk-linux-x64-release.zip"
        echo "${DART_SHA256}  ${archive}" | sha256sum -c -
        rm -rf "${dest}/dart-sdk"
        # Python unpacks it: the Playwright image has no unzip. A zip keeps the executable bits in
        # its entries' attributes, which extract() drops, so they are set again
        python3 -I - "${archive}" "${dest}" <<'PY'
        import os, stat, sys, zipfile
        dest = sys.argv[2]
        with zipfile.ZipFile(sys.argv[1]) as zf:
            for info in zf.infolist():
                path = zf.extract(info, dest)
                mode = info.external_attr >> 16
                if stat.S_ISREG(mode):
                    os.chmod(path, mode & 0o755)
        PY
        rm -f "${archive}"
        echo "${dest}/dart-sdk/bin" >> "$GITHUB_PATH"
        echo "DART_SDK=${dest}/dart-sdk" >> "$GITHUB_ENV"
