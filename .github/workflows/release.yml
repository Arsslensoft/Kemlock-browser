name: Release

# Every push to main that passes the checks and holds a feat, a fix, a perf or a revert commit
# (Conventional Commits) since the last v* tag is a release. next-version.mjs works out the version
# from the commits. The commit is then built twice, on two runners, in the build container (Node
# and Debian pinned by hash; tool/build.sh --version), and only if the two builds are the same bytes is it tagged
# v<version> and released on GitHub (the zips, their sums, and the changes grouped by type). No
# commit is made, so that main can require pull requests: the version is the tag's, and
# `tool/build.sh v<version>` later rebuilds the same bytes. A push of docs, chore, test, ci,
# style, refactor or build commits alone releases nothing. If a job fails, re-run its failed jobs:
# a run started over takes a tag that is there already as it is.
#
# The stores are a step beyond that, each its own job in the `stores` environment (its owner can
# require reviewers there), and off until the repository variable PUBLISH_STORES is `true` and the
# store's secrets are set. The extension is in development: they are off.
#
# Secrets, in the stores environment: AMO_JWT_ISSUER and AMO_JWT_SECRET; CWS_PUBLISHER_ID,
# CWS_EXTENSION_ID and CWS_SERVICE_ACCOUNT_KEY; EDGE_PRODUCT_ID, EDGE_CLIENT_ID and EDGE_API_KEY.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One release at a time, the next one waiting for it: it starts from the tag this one makes
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything a pull request passes, again on what main is now. The App drift job, which only
  # says that the Kemlock app has moved on from the copies, is left out
  checks:
    name: Checks
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml
    with:
      app-drift: false
    permissions:
      contents: read

  # What the commits since the last tag make of the next version, if anything
  version:
    name: Version
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      existing: ${{ steps.next.outputs.existing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      # Prints release, version, tag and existing (the commit has its tag already) to the outputs
      - name: Work out the version
        id: next
        run: node .github/scripts/next-version.mjs

  # The commit, built in the container on two different runners: tool/build.sh builds from the
  # commit's own files with the pinned Node, so that the two give the same bytes. The commit has no
  # tag yet, so the version is given to the build
  build:
    name: Build ${{ matrix.run }}
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - run: first
            runner: ubuntu-24.04
          - run: second
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the commit
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: tool/build.sh --version "${VERSION}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zips-${{ matrix.run }}
          path: dist/release/
          if-no-files-found: error

  # The two builds, byte for byte. Only if they are the same are the zips and their sums kept, and
  # the commit tagged
  compare:
    name: Compare the builds
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zips-*
          path: builds

      - name: Compare the two builds
        run: |
          cd builds
          (cd zips-first && sha256sum ./*.zip) > first.sums
          (cd zips-second && sha256sum ./*.zip) > second.sums
          if ! cmp first.sums second.sums; then
            echo "::error title=Release::The two builds differ, so this release is not published"
            echo "first runner:" && cat first.sums
            echo "second runner:" && cat second.sums
            exit 1
          fi
          for zip in zips-first/*.zip; do
            cmp "${zip}" "zips-second/$(basename "${zip}")"
          done
          echo "The two builds are the same, byte for byte."
          mkdir ../files
          cp zips-first/*.zip ../files/
          (cd ../files && sha256sum ./*.zip | sed 's# \./# #' > SHA256SUMS)
          cat ../files/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: files/
          if-no-files-found: error

  # The annotated tag on the commit that was built. The tag is pushed alone: nothing is committed
  # to main. A commit that has its tag already (a run started over) is left as it is
  tag:
    name: Tag
    needs: [version, compare]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The token is given to git for this command alone, not left in the checkout's config
      - name: Tag the commit
        if: needs.version.outputs.existing != 'true'
        env:
          TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          header="$(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          echo "::add-mask::${header}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${header}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Kemlock for browsers ${VERSION}"
          git push origin "refs/tags/${TAG}"

  # The GitHub release: both zips, their sums, and the changes since the last release
  release:
    name: GitHub release
    needs: [version, compare, tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: files

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      # The changes since the last release, grouped by type. The script's outputs (the release before
      # this one among them) are this step's
      - name: Write the notes
        id: notes
        run: node .github/scripts/next-version.mjs --notes "${RUNNER_TEMP}/notes.md"

      - name: Link to all the changes
        if: steps.notes.outputs.previous != ''
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS: ${{ steps.notes.outputs.previous }}
        run: |
          link="https://github.com/${REPO}/compare/${PREVIOUS}...${TAG}"
          printf '\n**Full changelog**: %s\n' "${link}" >> "${RUNNER_TEMP}/notes.md"

      # A release that is there already (a run started over) is left as it is
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "::notice title=Release::${TAG} is released already"
            exit 0
          fi
          gh release create "${TAG}" --repo "${REPO}" --verify-tag --latest \
            --title "Kemlock for browsers ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md" \
            files/*.zip files/SHA256SUMS

  # Firefox Add-ons, signed by Mozilla from the Firefox zip's files, with the source for the
  # reviewers. The first listing of the add-on is made by hand on addons.mozilla.org
  firefox:
    name: Firefox Add-ons
    needs: [version, release]
    if: needs.version.outputs.release == 'true' && vars.PUBLISH_STORES == 'true'
    runs-on: ubuntu-24.04
    environment: stores
    permissions:
      contents: read
    steps:
      - name: Are the secrets set
        id: keys
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "${AMO_JWT_ISSUER}" ] && [ -n "${AMO_JWT_SECRET}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Firefox Add-ons::AMO_JWT_ISSUER or AMO_JWT_SECRET is not set: not published"
          fi

      - if: steps.keys.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          persist-credentials: false

      - if: steps.keys.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: files

      - if: steps.keys.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      # web-ext only signs: no package's install script runs where the secrets are, and the step
      # that installs has none
      - if: steps.keys.outputs.ready == 'true'
        name: Install web-ext
        run: npm ci --ignore-scripts --no-audit --no-fund

      # web-ext reads the issuer and the secret from WEB_EXT_API_KEY and WEB_EXT_API_SECRET, which
      # keeps them out of the command line
      - if: steps.keys.outputs.ready == 'true'
        name: Sign and submit
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          unzip -q files/kemlock-*-firefox.zip -d "${RUNNER_TEMP}/firefox"
          git archive --format=zip -o "${RUNNER_TEMP}/source.zip" HEAD
          node_modules/.bin/web-ext sign --channel listed --approval-timeout 0 \
            --source-dir "${RUNNER_TEMP}/firefox" --artifacts-dir "${RUNNER_TEMP}/signed" \
            --upload-source-code "${RUNNER_TEMP}/source.zip"

  # The Chrome Web Store: the Chrome zip uploaded and submitted for review (API v2, as a service
  # account)
  chrome:
    name: Chrome Web Store
    needs: [version, release]
    if: needs.version.outputs.release == 'true' && vars.PUBLISH_STORES == 'true'
    runs-on: ubuntu-24.04
    environment: stores
    permissions:
      contents: read
    steps:
      - name: Are the secrets set
        id: keys
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "${CWS_PUBLISHER_ID}" ] && [ -n "${CWS_EXTENSION_ID}" ] \
            && [ -n "${CWS_SERVICE_ACCOUNT_KEY}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Chrome Web Store::A CWS_ secret is not set: not published"
          fi

      - if: steps.keys.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          persist-credentials: false

      - if: steps.keys.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: files

      - if: steps.keys.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - if: steps.keys.outputs.ready == 'true'
        name: Upload and submit
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
        run: node .github/scripts/publish-chrome.mjs files/kemlock-*-chrome.zip

  # Microsoft Edge Add-ons: the same Chrome zip, uploaded and submitted for review
  edge:
    name: Edge Add-ons
    needs: [version, release]
    if: needs.version.outputs.release == 'true' && vars.PUBLISH_STORES == 'true'
    runs-on: ubuntu-24.04
    environment: stores
    permissions:
      contents: read
    steps:
      - name: Are the secrets set
        id: keys
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          if [ -n "${EDGE_PRODUCT_ID}" ] && [ -n "${EDGE_CLIENT_ID}" ] && [ -n "${EDGE_API_KEY}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Edge Add-ons::An EDGE_ secret is not set: not published"
          fi

      - if: steps.keys.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          persist-credentials: false

      - if: steps.keys.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: files

      - if: steps.keys.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - if: steps.keys.outputs.ready == 'true'
        name: Upload and submit
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: node .github/scripts/publish-edge.mjs files/kemlock-*-chrome.zip "Release ${VERSION}"
