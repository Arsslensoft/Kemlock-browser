publish_to: none

environment:
  sdk: ^3.13.5

dependencies:
  cryptography: ^2.9.0
  crypto: ^3.0.7
  http: ^1.6.0
  kemlock_core:
    git:
      url: https://github.com/Arsslensoft/Kemlock-core.git
      ref: 61a27f0aca2e2a03018c8d40dc9d6ce930312600
  web: ^1.1.1
  zxing2: ^0.2.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.1
