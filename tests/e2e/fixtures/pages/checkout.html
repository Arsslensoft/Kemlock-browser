<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Checkout</title>
    <link rel="stylesheet" href="/page.css" />
  </head>
  <body>
    <main>
      <h1>Checkout</h1>
      <form method="post" action="/pay">
        <label for="holder">Name on card</label>
        <input id="holder" name="holder" autocomplete="cc-name" />
        <label for="number">Card number</label>
        <input id="number" name="number" autocomplete="cc-number" inputmode="numeric" />
        <label for="month">Expiry month</label>
        <select id="month" name="month" autocomplete="cc-exp-month">
          <option value="">Month</option>
          <option value="01">01 - January</option>
          <option value="02">02 - February</option>
          <option value="03">03 - March</option>
          <option value="04">04 - April</option>
          <option value="05">05 - May</option>
          <option value="06">06 - June</option>
          <option value="07">07 - July</option>
          <option value="08">08 - August</option>
          <option value="09">09 - September</option>
          <option value="10">10 - October</option>
          <option value="11">11 - November</option>
          <option value="12">12 - December</option>
        </select>
        <label for="year">Expiry year</label>
        <select id="year" name="year" autocomplete="cc-exp-year">
          <option value="">Year</option>
          <option value="2028">2028</option>
          <option value="2029">2029</option>
          <option value="2030">2030</option>
          <option value="2031">2031</option>
        </select>
        <label for="cvc">Security code</label>
        <input id="cvc" name="cvc" autocomplete="cc-csc" maxlength="4" />
        <button type="submit">Pay now</button>
      </form>
    </main>
  </body>
</html>
