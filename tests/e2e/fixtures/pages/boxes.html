<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Enter your code</title>
    <link rel="stylesheet" href="/page.css" />
  </head>
  <body>
    <main>
      <h1>Enter your code</h1>
      <p>We sent a six digit code.</p>
      <form method="post" action="/code">
        <div class="boxes" role="group" aria-label="Code digits">
          <input
            class="box"
            name="d1"
            type="text"
            inputmode="numeric"
            maxlength="1"
            aria-label="Digit 1"
          />
          <input
            class="box"
            name="d2"
            type="text"
            inputmode="numeric"
            maxlength="1"
            aria-label="Digit 2"
          />
          <input
            class="box"
            name="d3"
            type="text"
            inputmode="numeric"
            maxlength="1"
            aria-label="Digit 3"
          />
          <input
            class="box"
            name="d4"
            type="text"
            inputmode="numeric"
            maxlength="1"
            aria-label="Digit 4"
          />
          <input
            class="box"
            name="d5"
            type="text"
            inputmode="numeric"
            maxlength="1"
            aria-label="Digit 5"
          />
          <input
            class="box"
            name="d6"
            type="text"
            inputmode="numeric"
            maxlength="1"
            aria-label="Digit 6"
          />
        </div>
        <button type="submit">Verify</button>
      </form>
      <script>
        // As real sites do: a digit moves the focus to the next box
        const boxes = [...document.querySelectorAll('.box')]
        boxes.forEach((box, i) =>
          box.addEventListener('input', () => {
            if (box.value && boxes[i + 1]) boxes[i + 1].focus()
          }),
        )
      </script>
    </main>
  </body>
</html>
